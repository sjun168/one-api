name: Build ClawPal One API

on:
  push:
    branches: [clawpal]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save version info
        run: git describe --tags > VERSION || echo "v0.6.11-clawpal" > VERSION

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.6.11-clawpal
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:clawpal-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
